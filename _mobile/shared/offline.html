<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Koneksi Terputus</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #f8f9fa 0%, #fff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }
        .icon {
            width: 100px; height: 100px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(5,150,105,0.15);
            margin-bottom: 20px;
        }
        .icon svg {
            width: 50px; height: 50px;
            color: #059669;
        }
        h2 { color: #059669; margin-bottom: 10px; font-size: 1.1rem; }
        p { color: #6c757d; margin-bottom: 25px; font-size: 0.85rem; }
        button {
            background: #059669;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 12px 40px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        button:active { transform: scale(0.95); opacity: 0.8; }
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
            margin: 0 auto 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
        </svg>
    </div>
    <h2>Koneksi Terputus</h2>
    <p>Periksa koneksi internet Anda, lalu coba lagi.</p>
    <div class="spinner" id="spinner"></div>
    <button id="retryBtn" onclick="retry()">Coba Lagi</button>

    <script>
        function retry() {
            document.getElementById('spinner').style.display = 'block';
            document.getElementById('retryBtn').style.display = 'none';

            // Try native reload first (Android/iOS)
            if (window.NativeBridge && window.NativeBridge.reload) {
                window.NativeBridge.reload();
                return;
            }

            // Fallback: fetch test
            fetch(location.href.split('?')[0] + '?t=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
                .then(function(r) {
                    if (r.ok) location.reload();
                    else fail();
                })
                .catch(function() { fail(); });
        }

        function fail() {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('retryBtn').style.display = 'inline-block';
        }

        // Listen for native online event
        window.addEventListener('online', function() { location.reload(); });
    </script>
</body>
</html>
